<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Dual Research & Consulting</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="Dual Research & Consulting Logo" class="logo">
            </a>
            <nav>
                <ul>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="research.html">Research</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="contact">
            <div class="container">
                <div class="contact-intro">
                    <p>Have questions or need assistance? Reach out below.</p>
                </div>
                <form action="your_form_handler_url" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
        
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
        
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
        
                    <button type="submit">Send</button>
                </form>
            </div>
        </section>
        
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Dual Research & Consulting. All rights reserved.</p>
            <p>Contact us: <a href="mailto:info@dualresearchconsulting.com">info@dualresearchconsulting.com</a></p>
        </div>
    </footer>

    <!-- Social Icons Below the Footer -->
    <div class="social-icons-container">
        <div class="social-icons">
            <a href="https://www.linkedin.com/company/dual-research-and-consulting/" target="_blank" class="social-link">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/Dual-Research-and-Consulting" target="_blank" class="social-link">
                <i class="fab fa-github"></i>
            </a>
            <a href="mailto:info@dualresearchconsulting.com" class="social-link">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </div>
</body>
</html>
